---
apache2_vhosts:
  - name: app
    server_name: "{{ inventory_hostname }}"
    server_aliases: []
    document_root: /var/www/app
    allow_override: All
    letsencrypt: true

# Let's Encrypt
letsencrypt_email: admin@example.com
letsencrypt_staging: false   # true = Test-CA (nicht vertrauenswürdig, keine Rate-Limits)
apache2_hsts: false            # erst einschalten, wenn HTTPS stabil läuft

firewall_rules_web:
  - { port: "80,443", proto: tcp, comment: "HTTP/HTTPS" }

# ---------------- Benutzer/Gruppen nur auf Webservern ----------------
users_groups_web:
  - name: webdevs          # darf nur Apache neu laden/starten und Logs lesen
    sudo_nopasswd: true
    sudo_commands:
      - /usr/bin/systemctl reload apache2
      - /usr/bin/systemctl restart apache2
      - /usr/bin/systemctl status apache2
      - /usr/bin/tail -f /var/log/apache2/*
users_list_web: []
