---
ansible_user: deploy
env_name: staging

common_timezone: Europe/Berlin

# ---------------- Gruppen ----------------
users_groups_base:
  - name: admins          # volle Root-Rechte
    sudo: true
    sudo_nopasswd: false
  - name: automation      # Ansible-Benutzer: sudo ohne Passwort (nötig für become)
    sudo: true
    sudo_nopasswd: true

# ---------------- Benutzer (auf allen Hosts) ----------------
users_list_base:
  - name: deploy
    comment: Ansible Automation
    groups: [automation]
    ssh_keys: []            # <- Public-Key des Ansible-Controllers eintragen!
    ssh_keys_exclusive: true
  # - name: max
  #   comment: Max Mustermann
  #   groups: [admins]
  #   ssh_keys: ["ssh-ed25519 AAAA... max@laptop"]
