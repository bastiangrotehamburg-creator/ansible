---
- name: Kubernetes-Pakete installieren
  ansible.builtin.apt:
    name: "{{ kubernetes_packages | map('regex_replace', '$', '=' ~ kubernetes_version ~ '.*') | list }}"
    state: present

- name: Kubernetes-Pakete gegen automatische Updates sperren (hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"

- name: Kubelet aktivieren
  ansible.builtin.service:
    name: kubelet
    enabled: true
