---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Kubernetes apt repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
    force: true

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/deb/ /
    filename: kubernetes
    state: present

- name: Unhold Kubernetes packages before (re)installing
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ kubernetes_packages }}"
  when: kubernetes_hold_packages | bool

- name: Install/upgrade Kubernetes packages to the pinned version
  ansible.builtin.apt:
    name: "{{ item }}={{ kubernetes_target_version }}-*"
    state: present
    update_cache: true
    allow_downgrade: true
  loop: "{{ kubernetes_packages }}"
  notify: restart kubelet

- name: Hold Kubernetes packages at the pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"
  when: kubernetes_hold_packages | bool
