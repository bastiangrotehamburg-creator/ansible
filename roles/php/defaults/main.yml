---
php_packages:
  - php
  - php-cli
  - libapache2-mod-php
php_extensions:
  - php-mysql
  - php-curl
  - php-xml
  - php-mbstring
  - php-gd
  - php-zip
  - php-intl
  - php-opcache
php_ini:
  memory_limit: 256M
  upload_max_filesize: 64M
  post_max_size: 64M
  max_execution_time: 60
  expose_php: "Off"
  date.timezone: "{{ common_timezone | default('Europe/Berlin') }}"
php_sapis:
  - apache2
  - cli
