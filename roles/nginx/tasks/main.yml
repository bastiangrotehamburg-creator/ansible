---
- name: Nginx installieren
  ansible.builtin.package:
    name: nginx
    state: present

- name: Default-Site konfigurieren
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Debian-Default-Site entfernen
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Nginx starten und aktivieren
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
